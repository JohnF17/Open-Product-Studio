name: Feature request
description: Suggest an improvement to Open Product Studio.
title: "[Feature] "
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: Describe your project and where the current workflow gets in your way.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What outcome would help?
      description: Explain what you would expect to see or do differently.
    validations:
      required: true
