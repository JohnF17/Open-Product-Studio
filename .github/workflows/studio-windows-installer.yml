name: Studio Windows installer

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full commit SHA of the selected workflow ref
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.sha }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: windows-2025
    timeout-minutes: 85
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      T3CODE_DESKTOP_SIGNED: 'false'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: 'true'
      DO_NOT_TRACK: '1'
    steps:
      - name: Check out the selected public commit
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ && "$CANDIDATE_SHA" == "$GITHUB_SHA" ]]
          git init --quiet
          git -c credential.helper= fetch --depth=1 --quiet --no-tags --no-recurse-submodules "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$CANDIDATE_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --quiet --detach --no-recurse-submodules FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          run-install: false
          cache: false
      - name: Install the locked build graph
        shell: bash
        run: vp install --frozen-lockfile --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts... --filter=@t3tools/monorepo
      - name: Build the Windows x64 helper and desktop bundles
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-pc-windows-msvc
          node apps/desktop/scripts/ensure-electron-runtime.mjs
          vp run build:desktop
      - name: Build and validate the unsigned NSIS payload
        run: node scripts/build-desktop-artifact.ts --platform win --target nsis --arch x64 --skip-build --output-dir release/qualification
      - name: Install, launch, restart and uninstall on the disposable runner
        shell: pwsh
        run: ./scripts/qualify-studio-windows-install.ps1
      - name: Keep qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: studio-windows-evidence-${{ github.sha }}
          path: |
            release/evidence/*.json
            release/evidence/*.png
          if-no-files-found: warn
          retention-days: 7
